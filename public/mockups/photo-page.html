<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mockup — รูปภาพความคืบหน้า (1 ปี)</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Noto Sans Thai", "Prompt", system-ui, -apple-system, sans-serif;
        background: #f4f4f5;
        color: #18181b;
        display: flex;
        justify-content: center;
        min-height: 100vh;
      }
      .app {
        width: 100%;
        max-width: 672px;
        padding: 24px 24px 64px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
      h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
      .sub { color: #71717a; font-size: 14px; margin-top: 4px; }
      .egg { color: #18A659; font-size: 22px; font-weight: 800; }

      .upload-btn {
        display: flex; align-items: center; justify-content: center;
        height: 48px; width: 100%;
        background: #18A659; color: #fff;
        font-size: 16px; font-weight: 600;
        border-radius: 9999px; border: 0; cursor: pointer;
      }
      .upload-btn:hover { background: #148D4C; }

      .tabs {
        display: flex; overflow: hidden;
        background: #fff; border: 1px solid #e4e4e7;
        border-radius: 16px;
      }
      .tab {
        flex: 1; text-align: center; font-weight: 600; font-size: 16px;
        padding: 12px 12px 10px;
        border: 0; background: transparent; cursor: pointer;
        border-bottom: 3px solid transparent; color: #a1a1aa;
      }
      .tab.active { border-bottom-color: #18A659; color: #18A659; }
      .tab:hover { background: #fafafa; color: #52525b; }

      /* ---- ความคืบหน้า: grid รายเดือน ---- */
      .grid {
        display: grid; gap: 16px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .card {
        background: #fff; border: 1px solid #e4e4e7; border-radius: 16px;
        padding: 16px;
      }
      .card h3 { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
      .views { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
      .view { display: flex; flex-direction: column; gap: 4px; }
      .frame {
        aspect-ratio: 3 / 4;
        border-radius: 12px;
        display: flex; align-items: flex-end; justify-content: center;
        color: rgba(255,255,255,0.9); font-size: 12px; font-weight: 600;
        padding: 6px;
        background-size: cover; background-position: center;
      }
      .view > span { text-align: center; font-size: 12px; color: #71717a; }

      /* ---- เปรียบเทียบ ---- */
      .compare {
        background: #fff; border: 1px solid #e4e4e7; border-radius: 16px; padding: 20px;
        display: flex; flex-direction: column; gap: 8px;
      }
      .compare h3 { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
      .selects { display: flex; gap: 12px; margin-bottom: 20px; }
      .field { flex: 1; display: flex; flex-direction: column; gap: 4px; }
      .field label { font-size: 12px; color: #71717a; font-weight: 500; }
      select {
        height: 44px; width: 100%;
        border: 1px solid #e4e4e7; border-radius: 12px;
        padding: 0 12px; font-size: 14px; color: #18181b; background: #fff;
      }
      .cmp-row { margin-bottom: 16px; }
      .cmp-head {
        display: flex; justify-content: space-between; align-items: center;
        font-size: 12px; font-weight: 600; color: #71717a; margin-bottom: 8px;
      }
      .cmp-head .month { flex: 1; text-align: center; }
      .cmp-head .view-label { width: 56px; text-align: center; }
      .cmp-cells {
        display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center;
      }
      .vs { color: #18A659; font-weight: 800; font-size: 14px; }
      .dim { opacity: 0.55; }
      .note { text-align: center; color: #71717a; font-size: 14px; padding: 32px 0; }

      @media (max-width: 640px) {
        .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div>
          <h1>รูปภาพ</h1>
          <div class="sub">ภาพถ่ายความคืบหน้า</div>
        </div>
        <span class="egg">🥚</span>
      </header>

      <button class="upload-btn">บันทึกรูปความคืบหน้า (กันยายน 2026)</button>

      <div class="tabs">
        <button class="tab" onclick="setTab('compare')">ความคืบหน้า</button>
        <button class="tab active" onclick="setTab('compare')">เปรียบเทียบ</button>
      </div>

      <!-- ความคืบหน้า -->
      <div id="panelGrid" class="grid"></div>

      <!-- เปรียบเทียบ -->
      <section id="panelCompare" class="compare" hidden>
        <h3>เปรียบเทียบรายเดือน</h3>
        <div class="selects">
          <div class="field">
            <label>เดือนที่ 1</label>
            <select>
              <option>ตุลาคม 2025</option>
              <option selected>พฤศจิกายน 2025</option>
              <option>ธันวาคม 2025</option>
              <option>มกราคม 2026</option>
            </select>
          </div>
          <div class="field">
            <label>เดือนที่ 2</label>
            <select>
              <option>สิงหาคม 2026</option>
              <option selected>กันยายน 2026</option>
            </select>
          </div>
        </div>

        <div class="cmp-row">
          <div class="cmp-head">
            <span class="month">พฤศจิกายน 2025</span>
            <span class="view-label">ด้านหน้า</span>
            <span class="month">กันยายน 2026</span>
          </div>
          <div class="cmp-cells">
            <div class="frame" style="background-image:url(&quot;https://dummyimage.com/300x400/94a3b8/fff.png?text=Front+A&quot;)"></div>
            <span class="vs">vs</span>
            <div class="frame" style="background-image:url(&quot;https://dummyimage.com/300x400/64748b/fff.png?text=Front+B&quot;)"></div>
          </div>
        </div>

        <div class="cmp-row">
          <div class="cmp-head">
            <span class="month">พฤศจิกายน 2025</span>
            <span class="view-label">ด้านข้าง</span>
            <span class="month">กันยายน 2026</span>
          </div>
          <div class="cmp-cells">
            <div class="frame" style="background-image:url(&quot;https://dummyimage.com/300x400/94a3b8/fff.png?text=Side+A&quot;)"></div>
            <span class="vs">vs</span>
            <div class="frame" style="background-image:url(&quot;https://dummyimage.com/300x400/64748b/fff.png?text=Side+B&quot;)"></div>
          </div>
        </div>

        <div class="cmp-row">
          <div class="cmp-head">
            <span class="month">พฤศจิกายน 2025</span>
            <span class="view-label">ด้านหลัง</span>
            <span class="month">กันยายน 2026</span>
          </div>
          <div class="cmp-cells">
            <div class="frame" style="background-image:url(&quot;https://dummyimage.com/300x400/94a3b8/fff.png?text=Back+A&quot;)"></div>
            <span class="vs">vs</span>
            <div class="frame" style="background-image:url(&quot;https://dummyimage.com/300x400/64748b/fff.png?text=Back+B&quot;)"></div>
          </div>
        </div>
      </section>
    </div>

    <script>
      const THAI = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
      const grid = document.getElementById("panelGrid");
      const colors = ["#18A659","#3B82F6","#8B5CF6","#F59E0B","#EF4444","#14B8A6","#6366F1","#EC4899","#F97316","#10B981","#06B6D4","#E11D48"];
      const views = ["Front","Side","Back"];
      const labels = ["ด้านหน้า","ด้านข้าง","ด้านหลัง"];
      let year = 2026, month = 8;

      for (let i = 0; i < 12; i++) {
        const mKey = (month + 1 + "").padStart(2, "0");
        const card = document.createElement("section");
        card.className = "card";
        const c = colors[i % colors.length];
        card.innerHTML =
          `<h3>${THAI[month]} ${year}</h3><div class="views">` +
          views.map((v) =>
            `<div class="view">` +
              `<div class="frame" style="background-image:url('https://dummyimage.com/300x400/${c.replace('#','')}/fff.png?text=${v}+${mKey}')"></div>` +
              `<span>${v === "Front" ? "ด้านหน้า" : v === "Side" ? "ด้านข้าง" : "ด้านหลัง"}</span>` +
            `</div>`).join("") +
          `</div>`;
        grid.appendChild(card);

        month--;
        if (month < 0) { month = 11; year--; }
      }

      const gridPanel = document.getElementById("panelGrid");
      function setTab(name) {
        const tabs = document.querySelectorAll(".tab");
        tabs.forEach(t => t.classList.remove("active"));
        event.target.classList.add("active");
        gridPanel.hidden = name !== "grid";
        document.getElementById("panelCompare").hidden = name !== "compare";
      }
    </script>
  </body>
</html>
