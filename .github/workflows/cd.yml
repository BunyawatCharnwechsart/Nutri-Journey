name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  migrate:
    name: Run database migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        env:
          DATABASE_URL_PROVIDED: ${{ secrets.DATABASE_URL_PROVIDED }}
        run: node scripts/run-migration.mjs

  deploy:
    name: Deploy to Vercel (production)
    needs: [migrate]
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Override sensitive NEXT_PUBLIC_ env vars
        run: |
          if [ -f .vercel/.env.production.local ]; then
            grep -v '^NEXT_PUBLIC_LIFF_ID=' .vercel/.env.production.local > .vercel/.env.production.local.tmp || true
            echo "NEXT_PUBLIC_LIFF_ID=${{ secrets.NEXT_PUBLIC_LIFF_ID }}" >> .vercel/.env.production.local.tmp
            mv .vercel/.env.production.local.tmp .vercel/.env.production.local
            echo "Overrode NEXT_PUBLIC_LIFF_ID with the real value from GitHub secrets."
          else
            echo "warning: .vercel/.env.production.local not found; skipping override"
          fi

      - name: Build project artifacts
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy project artifacts to Vercel
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}