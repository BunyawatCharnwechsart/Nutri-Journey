name: Preview Deploy

on:
  pull_request:
    branches: [main]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  preview:
    name: Deploy preview to Vercel
    runs-on: ubuntu-latest
    # Dependabot PRs never receive repo secrets (GitHub security default), so
    # VERCEL_TOKEN is empty and the deploy would always fail. Skip them —
    # dependabot bumps are validated by CI and get a production deploy anyway.
    if: github.actor != 'dependabot[bot]'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Override sensitive NEXT_PUBLIC_ env vars
        run: |
          if [ -f .vercel/.env.preview.local ]; then
            grep -v '^NEXT_PUBLIC_LIFF_ID=' .vercel/.env.preview.local > .vercel/.env.preview.local.tmp || true
            echo "NEXT_PUBLIC_LIFF_ID=${{ secrets.NEXT_PUBLIC_LIFF_ID }}" >> .vercel/.env.preview.local.tmp
            mv .vercel/.env.preview.local.tmp .vercel/.env.preview.local
            echo "Overrode NEXT_PUBLIC_LIFF_ID with the real value from GitHub secrets."
          else
            echo "warning: .vercel/.env.preview.local not found; skipping override"
          fi

      - name: Build project artifacts
        run: npx vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview
        id: deploy-preview
        run: |
          url=$(npx vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy-preview.outputs.url }}';
            const body = `## Preview Deployment\n\n✅ Preview is live: ${url}`;
            
            // Find existing bot comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c => c.user.type === 'Bot' && c.body.includes('Preview Deployment'));
            
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
